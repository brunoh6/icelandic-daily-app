<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#0B0F14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F8FB" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Lundi — learn Icelandic a little every day, from your first orð to real conversations." />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lundi" />

    <title>Lundi — Icelandic every day</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/views.css" />
    <link rel="stylesheet" href="styles/session.css" />
  </head>
  <body>
    <a class="skip-link" href="#screen">Skip to content</a>

    <div class="boot" id="boot" aria-hidden="true">
      <div class="boot__mark"></div>
      <p class="boot__word">Lundi</p>
    </div>

    <div class="app" id="app" hidden>
      <header class="topbar" id="topbar">
        <button class="topbar__brand" type="button" data-nav="learn" aria-label="Lundi home">
          <span class="topbar__logo" aria-hidden="true"></span>
        </button>

        <div class="topbar__stats" role="group" aria-label="Your progress">
          <button class="chip chip--streak" type="button" data-sheet="streak">
            <span class="chip__icon" aria-hidden="true">🔥</span>
            <span class="chip__value" id="statStreak">0</span>
            <span class="visually-hidden">day streak</span>
          </button>
          <button class="chip chip--xp" type="button" data-sheet="xp">
            <span class="chip__icon" aria-hidden="true">💎</span>
            <span class="chip__value" id="statXp">0</span>
            <span class="visually-hidden">total XP</span>
          </button>
          <button class="chip chip--goal" type="button" data-sheet="goal">
            <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
              <circle class="ring__track" cx="18" cy="18" r="15.5" />
              <circle class="ring__value" id="goalRing" cx="18" cy="18" r="15.5" />
            </svg>
            <span class="chip__value" id="statGoal">0</span>
            <span class="visually-hidden">XP toward today's goal</span>
          </button>
        </div>

        <button class="topbar__icon" type="button" data-nav="me" aria-label="Your profile">
          <span aria-hidden="true">⚙︎</span>
        </button>
      </header>

      <main class="screen" id="screen" tabindex="-1"></main>

      <nav class="tabbar" id="tabbar" aria-label="Main sections">
        <button class="tab is-active" type="button" data-nav="learn">
          <span class="tab__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v5h5"/></svg>
          </span>
          <span class="tab__label">Learn</span>
        </button>
        <button class="tab" type="button" data-nav="drill">
          <span class="tab__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6.5 6.5 17.5 17.5M3 10V5a2 2 0 0 1 2-2h5M21 14v5a2 2 0 0 1-2 2h-5"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
          </span>
          <span class="tab__label">Drill</span>
        </button>
        <button class="tab" type="button" data-nav="words">
          <span class="tab__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5Z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5A2.5 2.5 0 0 1 4 20.5Z"/></svg>
          </span>
          <span class="tab__label">Words</span>
        </button>
        <button class="tab" type="button" data-nav="grammar">
          <span class="tab__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 5h18M3 12h18M3 19h10"/><circle cx="18.5" cy="19" r="2.5"/></svg>
          </span>
          <span class="tab__label">Grammar</span>
        </button>
        <button class="tab" type="button" data-nav="me">
          <span class="tab__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5S20 17 20 21"/></svg>
          </span>
          <span class="tab__label">Me</span>
        </button>
      </nav>
    </div>

    <div class="layer" id="layer" hidden></div>
    <div class="sheet-host" id="sheetHost" hidden></div>
    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

    <script type="module" src="js/main.js"></script>
    <noscript>
      <p style="padding: 2rem; font: 16px/1.6 system-ui">
        Lundi needs JavaScript. Please enable it and reload.
      </p>
    </noscript>
  </body>
</html>
